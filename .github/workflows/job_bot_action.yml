name: Job Alert Bot

on:
  schedule:
    # 3 Strategic Runs (UTC) - 'Night Owl' Global Market Optimization
    # 07:11 UTC -> 12:41 PM IST (India Morning/Noon Surge)
    # 12:43 UTC -> 06:13 PM IST (EMEA Morning/Midday Surge)
    # 20:07 UTC -> 01:37 AM IST (US Silicon Valley/East Coast Peak)
    - cron: '11 7 * * *'
    - cron: '43 12 * * *'
    - cron: '7 20 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip' # Enable caching for pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-jobspy pyyaml pandas

    - name: Run Job Bot
      env:
        # Pass the secret directly to the environment
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        # No more sed commands needed!
        python job_alert_bot_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        # HEARTBEAT: Always track heartbeat.txt to prove repository activity
        git add job_history.json heartbeat.txt
        # Only commit if there are changes (Heartbeat will always change)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history and heartbeat [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
