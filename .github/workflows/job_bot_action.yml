name: Job Alert Bot

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the bot to update job_history.json

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-jobspy pyyaml pandas

    - name: Run Job Bot
      env:
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        # Inject the secret password into the config file
        sed -i "s/YOUR_APP_PASSWORD_HERE/$GMAIL_APP_PASSWORD/g" job_alert_config.yaml
        sed -i "s/qwerty/$GMAIL_APP_PASSWORD/g" job_alert_config.yaml
        python job_alert_bot_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        git add job_history.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
