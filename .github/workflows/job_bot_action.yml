name: Job Alert Bot

on:
  workflow_dispatch: # Allows manual and external API triggers (e.g. from cron-job.org)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main
      uses: actions/checkout@v3

    - name: Restore job history from data branch
      run: |
        git fetch origin data 2>/dev/null || true
        git checkout origin/data -- job_history.json 2>/dev/null || echo "No history yet, starting fresh"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Bot
      env:
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        python job_alert_bot_github.py

    - name: Save job history to data branch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        cp job_history.json /tmp/job_history.json
        if git show-ref --verify --quiet refs/remotes/origin/data; then
          git checkout -b data origin/data
        else
          git checkout --orphan data
          git rm -rf . --quiet 2>/dev/null || true
        fi
        cp /tmp/job_history.json job_history.json
        git add job_history.json
        git diff --staged --quiet || (git commit -m "Update job history [skip ci]" && git push origin data)
