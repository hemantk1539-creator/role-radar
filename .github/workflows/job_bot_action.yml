name: Job Alert Bot

on:
  schedule:
    # 4 Strategic Runs (UTC):
    # 02:15 UTC -> 07:45 AM IST (Inbox Prep / US Night Catch)
    # 05:15 UTC -> 10:45 AM IST (India Morning)
    # 11:15 UTC -> 04:45 PM IST (India Eve / EMEA Morning)
    # 17:15 UTC -> 10:45 PM IST (US East Coast Morning)
    - cron: '15 2,5,11,17 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the bot to update job_history.json

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-jobspy pyyaml pandas

    - name: Run Job Bot
      env:
        # Pass the secret directly to the environment
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        # No more sed commands needed!
        python job_alert_bot_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        # Check if job_history.json changed
        git add job_history.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
