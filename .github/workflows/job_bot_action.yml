name: Job Alert Bot

on:
  workflow_dispatch: # Allows manual and external API triggers (e.g. from cron-job.org)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Bot
      env:
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        python job_alert_bot_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        git add job_history.json heartbeat.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history and heartbeat [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
