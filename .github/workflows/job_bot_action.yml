name: Job Alert Bot

on:
  schedule:
    # Run at irregular intervals (15 and 45 past the hour)
    # This helps avoid the "top of the hour" congestion on GitHub Actions
    - cron: '15,45 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the bot to update job_history.json

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-jobspy pyyaml pandas

    - name: Run Job Bot
      env:
        # Pass the secret directly to the environment
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: |
        # No more sed commands needed!
        python job_alert_bot_github.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'JobBot-Automated'
        git config --global user.email 'bot@noreply.github.com'
        # Check if job_history.json changed
        git add job_history.json
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update job history [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
